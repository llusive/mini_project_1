<!doctype html>
<html lang="en">
  <template id="card-template">
    <div class="card" style="width: 10rem">
      <div class="card-body">
        <img class="img-fluid" alt="Card image" />
      </div>
    </div>
  </template>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deck</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <div class="col">
          <h1>Card Information</h1>
          <div id="card-image" class="row"></div>
          <h2 id="card-name" class="row"></h2>
          <p id="card-desc" class="row"></p>
        </div>
        <div class="col">
          <button id="sort">Sort</button>
          <button id="clear">Clear</button>
          <h1>Main Deck</h1>
          <div id="main-deck" class="row"></div>
          <h1>Extra Deck</h1>
          <div id="extra-deck" class="row"></div>
        </div>
        <div class="col">
          <input type="text" id="search" />
          <div id="card-list" class="row"></div>
        </div>
      </div>
    </div>

    <script type="module">
      const cards = [
        ...(
          await fetch("https://db.ygoprodeck.com/api/v7/cardinfo.php").then(
            (response) => response.json(),
          )
        ).data,
      ];

      const banlistTCG = [
        ...(
          await fetch(
            "https://db.ygoprodeck.com/api/v7/cardinfo.php?banlist=tcg",
          ).then((response) => response.json())
        ).data,
      ];

      const banlistOCG = [
        ...(
          await fetch(
            "https://db.ygoprodeck.com/api/v7/cardinfo.php?banlist=ocg",
          ).then((response) => response.json())
        ).data,
      ];

      /* const banlistGoat = [
        ...(await fetch("https://db.ygoprodeck.com/api/v7/cardinfo.php?banlist=goat").then(
            (response) => response.json(),
          )
        ).data,
      ]; */

      const mainDeck = {
        cards: [],
        normalMonsterCards: [],
        effectMonsterCards: [],
        ritualEffectMonsterCards: [],
        pendulumEffectMonsterCards: [],
        normalSpellCards: [],
        quickPlaySpellCards: [],
        continuousSpellCards: [],
        ritualSpellCards: [],
        equipSpellCards: [],
        fieldSpellCards: [],
        normalTrapCards: [],
        continuousTrapCards: [],
        counterTrapCards: [],
      };
      const extraDeck = {
        cards: [],
        fusionMonsterCards: [],
        synchroMonsterCards: [],
        xyzMonsterCards: [],
        linkMonsterCards: [],
        fusionEffectMonsterCards: [],
        synchroEffectMonsterCards: [],
        xyzEffectMonsterCards: [],
        linkEffectMonsterCards: [],
      };

      function addCard(card, section) {
        const template = document
          .getElementById("card-template")
          .content.cloneNode(true);
        template
          .querySelector("img")
          .setAttribute("src", card.card_images[0].image_url);
        template.querySelector("img").setAttribute("id", card.name);

        const cardFrameType = card.frameType;
        const cardType =
          card.humanReadableCardType.charAt(0).toLowerCase() +
          card.humanReadableCardType.split(/[ -]/).join("").slice(1) + "Cards";

        // On hover, display card info
        if (section != "card-image") {
          template
            .querySelector("img")
            .addEventListener("mouseover", (event) => {
              removeCards("card-image");
              addCard(
                cards.find((card) => card.name == event.target.id),
                "card-image",
              );
              document.getElementById("card-name").innerText = card.name;
              document.getElementById("card-desc").innerText = card.desc;
            });
        } else {
          // Enlarge card image in card info section
          template.querySelector(".card").setAttribute("style", "width: 40rem");
        }

        // On click, add to deck
        if (section == "card-list") {
          template.querySelector("img").addEventListener("click", (event) => {
            // Determine if card belongs in main deck or extra deck
            if (["fusion", "synchro", "xyz", "link"].includes(cardFrameType)) {
              // Maximum 3 copies per card per deck and maximum 15 cards per extra deck
              if (
                extraDeck.cards.reduce(
                  (total, card) =>
                    card.name == event.target.id ? total + 1 : total,
                  0,
                ) < 3 &&
                extraDeck.cards.length < 15
              ) {
                extraDeck.cards.push(card);
                extraDeck[cardType].push(card);
                addCard(
                  cards.find((card) => card.name == event.target.id),
                  "extra-deck",
                );
              }
            } else {
              // Maximum 3 copies per card per deck and maximum 60 cards per main deck
              if (
                mainDeck.cards.reduce(
                  (total, card) =>
                    card.name == event.target.id ? total + 1 : total,
                  0,
                ) < 3 &&
                mainDeck.cards.length < 60
              ) {
                mainDeck.cards.push(card);
                console.log(cardType);
                mainDeck[cardType].push(card);
                addCard(
                  cards.find((card) => card.name == event.target.id),
                  "main-deck",
                );
              }
            }
          });
        }

        // On click, remove from main deck
        if (section == "main-deck") {
          template.querySelector("img").addEventListener("click", (event) => {
            mainDeck.cards.splice(
              mainDeck.cards.findIndex((card) => card.name == event.target.id),
              1,
            );
            mainDeck[cardType].splice(
              mainDeck[cardType].findIndex(
                (card) => card.name == event.target.id,
              ),
              1,
            );

            removeCards("main-deck");

            mainDeck.cards.forEach((card) => {
              addCard(card, "main-deck");
            });
          });
        }

        // On click, remove from extra deck
        if (section == "extra-deck") {
          template.querySelector("img").addEventListener("click", (event) => {
            extraDeck.cards.splice(
              extraDeck.cards.findIndex((card) => card.name == event.target.id),
              1,
            );
            extraDeck[cardType].splice(
              extraDeck[cardType].findIndex(
                (card) => card.name == event.target.id,
              ),
              1,
            );

            removeCards("extra-deck");

            extraDeck.cards.forEach((card) => {
              addCard(card, "extra-deck");
            });
          });
        }

        document.querySelector(`#${section}`).appendChild(template);
      }

      function removeCards(section) {
        document.querySelector(`#${section}`).replaceChildren("");
      }

      // Sort deck
      document.getElementById("sort").addEventListener("click", () => {
        for (const cardType in mainDeck) {
          console.log("Unsorted: ", cardType, mainDeck[cardType]);
          mainDeck[cardType].sort((a, b) => a.name.localeCompare(b.name));
          console.log("Sorted: ", cardType, mainDeck[cardType]);
        }
        for (const cardType in extraDeck) {
          console.log("Unsorted: ", cardType, extraDeck[cardType]);
          extraDeck[cardType].sort((a, b) => a.name.localeCompare(b.name));
          console.log("Sorted: ", cardType, extraDeck[cardType]);
        }
        /* mainDeck.cards.sort((a, b) => a.name.localeCompare(b.name));
        extraDeck.cards.sort((a, b) => a.name.localeCompare(b.name)); */

        removeCards("main-deck");
        removeCards("extra-deck");

        const sortedMainDeck = [];
        for (const cardType in mainDeck) {
          if (cardType === "cards") continue;
          mainDeck[cardType].forEach((card) => {
            sortedMainDeck.push(card);
          })
        }
        console.log(sortedMainDeck);

        const sortedExtraDeck = [];
        for (const cardType in extraDeck) {
          if (cardType === "cards") continue;
          extraDeck[cardType].forEach((card) => {
            sortedExtraDeck.push(card);
          })
        }
        console.log(sortedExtraDeck);
        

        /* mainDeck.cards.forEach((card) => addCard(card, "main-deck"));
        extraDeck.cards.forEach((card) => addCard(card, "extra-deck")); */

        sortedMainDeck.forEach((card) => addCard(card, "main-deck"));
        sortedExtraDeck.forEach((card) => addCard(card, "extra-deck"));
      });

      // Clear deck
      document.getElementById("clear").addEventListener("click", () => {
        mainDeck.cards.length = 0;
        extraDeck.cards.length = 0;

        removeCards("main-deck");
        removeCards("extra-deck");
      });

      // Filter by card name
      const filterByName = document.getElementById("search");
      filterByName.addEventListener("input", () => {
        let filteredByName = cards.filter((card) =>
          card.name.toLowerCase().includes(filterByName.value.toLowerCase()),
        );

        removeCards("card-list");

        filteredByName.forEach((card) => addCard(card, "card-list"));
      });
    </script>
  </body>
</html>
