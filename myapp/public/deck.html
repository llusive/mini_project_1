<!doctype html>
<html lang="en">
  <template id="card-template">
    <div class="card col-8" style="width: 18rem">
      <div class="card-body">
        <img class="img-fluid" alt="Card image" />
        <!-- <h5 class="card-name">Card name</h5>
        <p class="card-description">Card description</p> -->
      </div>
    </div>
  </template>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deck</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <div id="deck-list" class="row"></div>

    <input type="text" id="search" />
    <div id="card-list" class="row"></div>
    <script type="module">
      const result = await fetch(
        "https://db.ygoprodeck.com/api/v7/cardinfo.php",
      ).then((response) => response.json());

      const cards = [...result.data]

      function getCards(parameters) {
        return new Promise((resolve) => {
          resolve(
            fetch(
              `https://db.ygoprodeck.com/api/v7/cardinfo.php?fname=${parameters}`,
            ).then((response) => response.json()),
          );
        });
      }

      let deckCards = new Map();
      let filteredCards = [];
      let selectedCard;
      function addCard(card, identifier) {
        const template = document
          .getElementById("card-template")
          .content.cloneNode(true);
        template
          .querySelector("img")
          .setAttribute("src", card.card_images[0].image_url);
        template.querySelector("img").setAttribute("id", filteredCards.length);

        template.querySelector("img").addEventListener("click", (event) => {
          selectedCard = filteredCards[event.target.id];
          addCard(selectedCard, "deck-list");
          if (identifier == "card-list") {
            deckCards.set(
              selectedCard.name,
              deckCards.has(selectedCard.name)
                ? deckCards.get(selectedCard.name) + 1
                : 1,
            );
          }
        });

        if (identifier == "deck-list") {
          template.querySelector("img").addEventListener("click", (event) => {
            selectedCard = filteredCards[event.target.id];

            // Reduce quantity of that card and remove from map if quantity is 0
            deckCards.set(
              selectedCard.name,
              deckCards.get(selectedCard.name) - 1,
            );
            if (deckCards.get(selectedCard.name) == 0)
              deckCards.delete(selectedCard.name);
            // note: quantity when clicked in the deck list should minimum be 1, never 0 so resulting quantity cant be -1 since no card to be clicked

            removeCards("deck-list"); // remove all desk list cards

            // re-add the saved deck-list
            const cardLookup = [];
            deckCards.entries().forEach((card) => {
              cardLookup.push(card[0]); // extract card name
            });
            cardLookup.forEach((cardName) => {
              fetch(
                `https://db.ygoprodeck.com/api/v7/cardinfo.php?name=${cardName}`,
              )
                .then((response) => response.json())
                .then((result) => {
                  console.log(result.data[0]);
                  addCard(result.data[0], "deck-list");
                });
            });
          });
        }

        document.querySelector(`#${identifier}`).appendChild(template);
        filteredCards.push(card);
      }

      function removeCards(identifier) {
        document.querySelector(`#${identifier}`).replaceChildren("");
        if (identifier == "card-list") {
          filteredCards = [];
        }
      }

      let prevPromise;
      const filterByName = document.getElementById("search");
      filterByName.addEventListener("input", () => {
        let filteredByName = cards.filter((card) =>
          card.name.toLowerCase().includes(filterByName.value.toLowerCase()),
        );
        
        removeCards("card-list");

        filteredByName.forEach((card) => addCard(card, "card-list"));
      });
    </script>
  </body>
</html>
