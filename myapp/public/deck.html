<!doctype html>
<html lang="en">
  <template id="card-template">
    <div class="card col-8" style="width: 18rem;">
      <div class="card-body">
        <img class="img-fluid" alt="Card image" />
        <!-- <h5 class="card-name">Card name</h5>
        <p class="card-description">Card description</p> -->
      </div>
    </div>
  </template>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deck</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>    
    <div id="deck-list" class="row"></div>

    <input type="text" id="search" />
    <div id="card-list" class="row"></div>
    <script type="module">
      const cards = await fetch(
        "https://db.ygoprodeck.com/api/v7/cardinfo.php",
      ).then((response) => response.json());
      console.log(cards.data);

      function getCards(parameters) {
        return new Promise((resolve) => {
          resolve(
            fetch(
              `https://db.ygoprodeck.com/api/v7/cardinfo.php?fname=${parameters}`,
            ).then((response) => response.json()),
          );
        });
      }
      
      let deckCards = new Map;
      let filteredCards = [];
      let selectedCard;
      function addCard(card, identifier) {
        const template = document
          .getElementById("card-template")
          .content.cloneNode(true);
        template.querySelector("img").setAttribute("src", card.card_images[0].image_url);
        template.querySelector("img").setAttribute("id", filteredCards.length); // Save reference in the card body to the card's data in the filtered results
        template.querySelector("img").addEventListener("click", (event) => {
          selectedCard = filteredCards[event.target.id];
          console.log(selectedCard);
          console.log(identifier);
          addCard(selectedCard, "deck-list");
          if (identifier == "card-list") {
            deckCards.set(selectedCard.name, deckCards.has(selectedCard.name) ? deckCards.get(selectedCard.name) + 1 : 1);
            console.log(deckCards);
          }
        })
        if (identifier == "deck-list") {
          template.querySelector("img").addEventListener("click", (event) => {
            removeCards("deck-list");
            console.log(identifier);
            selectedCard = filteredCards[event.target.id];
            deckCards.set(selectedCard.name, deckCards.get(selectedCard.name) - 1);
            if (deckCards.get(selectedCard.name) == 0) deckCards.delete(selectedCard.name);
            console.log(deckCards);
          })
        } // bug where cards undefined when 1 card is removed from deck
        
        document.querySelector(`#${identifier}`).appendChild(template);
        filteredCards.push(card);
        console.log(filteredCards);
      }

      function removeCards(identifier) {
        //document.querySelector("#card-info").replaceChildren("");
        document.querySelector(`#${identifier}`).replaceChildren("");
        if (identifier == "card-list") {
          filteredCards = [];
        }
      }

      let prevPromise;
      const filterByName = document.getElementById("search");
      filterByName.addEventListener("input", () => {
        // getCards(filterByName.value).then((result) => result.data.forEach((card) => addCard(card)));
        
        Promise.reject(prevPromise).catch((rejected) => {
            console.log(filterByName.value, "Old promise rejected", rejected);
          });
        const currPromise = getCards(filterByName.value);
        Promise.resolve(currPromise)
          .then((result) => {
            prevPromise = currPromise;
            removeCards("card-list");
            result.data.forEach((card) => {
              addCard(card, "card-list");
            })
          })
      });

      
    </script>
  </body>
</html>
